
---

- assert:
    that:
      - exp_jobs_to_enqueue is defined
      - exp_name is defined

- name: Warn if slurm_cpu_cores or slurm_cpu_mem_per_core_mb is defined since trillium does not support these settings
  ansible.builtin.debug:
    msg: "Warning: slurm_cpu_cores or slurm_cpu_mem_per_core_mb is defined but will be ignored on Trillium."
  when: slurm_cpu_cores is defined or slurm_cpu_mem_per_core_mb is defined

- name: query current state
  shell: squeue --json -u {{ trillium_user }}
  register: my_queue

- name: find jobs of same suite and same experiment that are not complete that we are going to cancel
  set_fact:
    jobs_to_cancel: "{{ my_slurm_jobs | zip(my_slurm_jobs | map(attribute='name') | map('job_info_from_safe_string')) | map('tuple2dict', keys=['slurm', 'job_id']) | json_query(my_query) }}"
  vars:
    my_query: "[?(job_id.suite=='{{ suite }}') && (job_id.exp_name=='{{ exp_name }}') && (slurm.job_state != 'COMPLETED')].{suite:job_id.suite, exp_name:job_id.exp_name, slurm_job_id:slurm.job_id}"
    my_slurm_jobs: "{{ my_queue.stdout | from_json | json_query('jobs[*].{job_id:job_id, job_state:job_state, name:name}') }}"

- name: show jobs to cancel
  debug:
    var: jobs_to_cancel

- name: cancel jobs from same suite
  shell: scancel {{ jobs_to_cancel | map(attribute='slurm_job_id') | join(' ')}}
  when: (jobs_to_cancel | list | length) > 0

# TODO [nku] could replace with custom module that does the enqueue (group by host and then do the enqueue)
- name: schedule the job on trillium using slurm
  vars:
    experiment_name: "{{ job.job_info | safe_job_info_string }}"
    output_file: "{{ job.exp_working_dir }}/results/stdout.log"
    error_file: "{{ job.exp_working_dir }}/results/stderr.log"
    gpu_cmd: >-
      {{ '--gpus=' + slurm_gpu_number | default(0) | string + ' --gres=gpumem:' + slurm_gpu_min_mem_per_gpu_mb | default(0) | string
      if slurm_gpu_model is none
      else
      '--gpus=' + slurm_gpu_model + ':' +  slurm_gpu_number | default(0) | string }}
    cpu_cmd: --time={{ job.exp_run_config.get('$slurm_job_minutes$', slurm_job_minutes) }} -n {{ slurm_cpu_cores }} --mem-per-cpu={{ slurm_cpu_mem_per_core_mb }}
    # TODO [nku] could also support custom number of cpu cores and memory but this would be a bit against the idea of host types
  register: sbatch_output
  shell: |
    source /etc/profile
    source ~/.bash_profile
    . /cluster/apps/local/env2lmod.sh
    module load {{ slurm_env }}
    sbatch -J {{ experiment_name }} -o {{ output_file }} -e {{ error_file }} --open-mode=truncate {{ cpu_cmd }} {{ gpu_cmd if slurm_gpu_number | int > 0 }} --wrap "{{ job.exp_run_cmd | replace('"', "'") }}"
  args:
    chdir: "{{ job.exp_working_dir }}"
    executable: /bin/bash
  delegate_to: "{{ job.host_info.ansible_host_id }}"
  loop: "{{ exp_jobs_to_enqueue }}"
  loop_control:
    loop_var: job
