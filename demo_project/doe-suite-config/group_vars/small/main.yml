---

# AWS EC2
instance_type: t2.medium
ec2_volume_size: 16
ec2_image_id: ami-08481eff064f39a84
ec2_volume_snapshot: snap-0b8d7894c93b6df7a

# ETH Euler
slurm_job_minutes: 10
slurm_cpu_cores: 1
slurm_cpu_mem_per_core_mb: 3072
slurm_gpu_number: 0
slurm_gpu_min_mem_per_gpu_mb: 0
slurm_gpu_model: ~
slurm_env: "stack/2024-06 gcc/12.2.0 python/3.11.6"
slurm_scratch_dir: "/cluster/scratch/{{ euler_user }}"

# Docker
docker_image_id: "doe-ubuntu20"
docker_image_tag: "latest"
